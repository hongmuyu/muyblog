name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Fetch secret content
        # 私密文章存放在独立私有仓库 muyblog-secret，用 PAT 拉取到 .secret-content，
        # 构建脚本（scripts/secret-category.js）会自动同步进 source/_posts/secret/ 并整页加密
        env:
          SECRET_CONTENT_PAT: ${{ secrets.SECRET_CONTENT_PAT }}
        run: |
          if [ -n "$SECRET_CONTENT_PAT" ]; then
            git clone --depth 1 "https://x-access-token:${SECRET_CONTENT_PAT}@github.com/hongmuyu/muyblog-secret.git" .secret-content
          else
            echo "::warning::SECRET_CONTENT_PAT 未配置，本次构建不含私密文章"
          fi

      - name: Build with Hexo
        run: npx hexo generate
        env:
          SECRET_CATEGORY_PASSWORD: ${{ secrets.SECRET_CATEGORY_PASSWORD }}

      - name: Verify build output
        run: |
          if [ ! -f public/index.html ]; then
            echo "::error::首页未生成——很可能把文章删光了（Hexo 零文章时不生成首页），本次不部署，站点保持上一个正常版本"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Sync backup branch
        run: git push --force origin main:backup

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
