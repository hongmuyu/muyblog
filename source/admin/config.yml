backend:
  name: github
  repo: hongmuyu/muyblog
  branch: main
  # 使用 PKCE 免代理认证，无需 client_secret
  auth_type: pkce
  # GitHub OAuth App 的 Client ID（创建后替换）
  app_id: REPLACE_WITH_YOUR_OAUTH_APP_CLIENT_ID

site_url: https://zouwenxiang.cn
display_url: https://zouwenxiang.cn
locale: zh_Hans

# 中文标题保留原文，避免被转码
slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

# 图片统一放 source/images，站点内通过 /images/ 访问
media_folder: source/images
public_folder: /images

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: source/_posts
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title, updated]
    summary: "{{title}} - {{date}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 发布日期, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss", date_format: "YYYY-MM-DD", time_format: "HH:mm:ss" }
      - { label: 更新日期, name: updated, widget: datetime, required: false, format: "YYYY-MM-DD HH:mm:ss", date_format: "YYYY-MM-DD", time_format: "HH:mm:ss" }
      - { label: 分类, name: categories, widget: list, required: false, add_label: 添加分类 }
      - { label: 标签, name: tags, widget: list, required: false, add_label: 添加标签 }
      - { label: 摘要描述, name: description, widget: string, required: false }
      - { label: 显示目录, name: toc, widget: boolean, default: true, required: false }
      - { label: 开启评论, name: comments, widget: boolean, default: true, required: false }
      - { label: 正文, name: body, widget: markdown }
